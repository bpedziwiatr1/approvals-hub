name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to pack and attach the zips to
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created with GITHUB_TOKEN does not start other workflows, so packing runs here, right after the release exists.
  pack:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - run: ./scripts/build-solution.ps1
        shell: pwsh
      - name: Attach the solution zips to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" out/ApprovalsHub_*_managed.zip out/ApprovalsHub_*_unmanaged.zip --clobber

  # Gitflow: the version bump and changelog land on main, so open the pull request that carries them back to develop.
  back-merge:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Open the pull request main into develop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge $TAG back into develop" \
            --body "Brings the version bump and changelog of $TAG back to develop. Merge with a merge commit."
